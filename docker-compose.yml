
services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: fleamarket-app
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=fleamarket
      - DB_USERNAME=root
      - DB_PASSWORD=secret

  web:
    image: nginx:1.24-alpine
    container_name: fleamarket-web
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: fleamarket-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: fleamarket
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: